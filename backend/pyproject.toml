[project]
name = "profile-manager-backend"
version = "1.0.0"
description = "MVP agéntico (LangGraph) del reto Profile Manager - Magneto/EAFIT"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends()/File() en firmas es el patrón de FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_test_cvs.py" = ["E501"]  # texto de CVs de ejemplo
